name: 데이터 오류 제보
description: 문항, 정답, 해설 등 데이터에 대한 오류
title: "[데이터 제보]"
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        이 제보는 공개 이슈로 표시됩니다. 이름·이메일·계정 정보 등 민감한 개인정보가 업로드되지 않도록 주의해 주세요.
  - type: dropdown
    id: year
    attributes:
      label: 시험 연도
      options:
        - "2020"
        - "2021"
        - "2022"
        - "2023"
        - "2024"
        - "2025"
        - "2026"
        - 해당 없음
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: 회차
      options:
        - "1회"
        - "2회"
        - "3회"
        - "4회"
        - 해당 없음
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: 문항 번호 또는 자료 항목
      placeholder: 예) 12번 / 합격률 통계
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 오류 유형
      options:
        - 문제 문구 또는 보기
        - 정답
        - 해설
        - 이미지 또는 표
        - 코드 표시
        - 합격률 통계
        - 기타
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 오류 내용
      description: 잘못된 정보를 서술해 주세요.
    validations:
      required: true
