name: 문항 자료 오류 제보
description: 복원 문항, 정답, 해설 또는 통계의 오류를 알려 주세요.
title: "[자료 제보] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        제보는 공개 이슈로 표시됩니다. 전체 문제·정답·해설을 복사하거나 PDF·문제지 이미지를 첨부하지 마세요. 오류를 특정할 최소 정보와 공개 출처 링크만 적어 주세요.
  - type: dropdown
    id: year
    attributes:
      label: 시험 연도
      options:
        - "2020"
        - "2021"
        - "2022"
        - "2023"
        - "2024"
        - "2025"
        - "2026"
        - 해당 없음
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: 회차
      options:
        - "1회"
        - "2회"
        - "3회"
        - "4회"
        - 해당 없음
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: 문항 번호 또는 자료 항목
      placeholder: 예) 12번 / 합격률 통계
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 오류 유형
      options:
        - 문제 문구 또는 보기
        - 정답
        - 해설
        - 이미지 또는 표
        - 코드 표시
        - 합격률 통계
        - 기타
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 오류 내용
      description: 어떤 부분이 왜 잘못되었는지 요약해 주세요. 긴 원문 인용은 피하고 꼭 필요한 짧은 부분만 적어 주세요.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 확인 가능한 공개 출처 URL
      description: 해당 자료를 확인할 수 있는 공개 웹페이지 주소를 적어 주세요. 원문 파일을 업로드하지 마세요.
      placeholder: https://...
    validations:
      required: false
