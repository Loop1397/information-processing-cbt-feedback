name: 버그 제보
description: 사용 중 발생한 오류 제보
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이 제보는 공개 이슈로 표시됩니다. 이름·이메일·계정 정보 등 민감한 개인정보가 업로드되지 않도록 주의해 주세요.
  - type: input
    id: page
    attributes:
      label: 문제가 발생한 화면 또는 주소
      placeholder: 예) 회차 선택 화면 / 2024년 2회 풀이 화면
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 기기와 브라우저
      placeholder: 예) Windows 11, Chrome 최신 버전
    validations:
      required: false
  - type: textarea
    id: detail
    attributes:
      label: 오류 내용
      description: 발생한 문제를 작성해 주세요.
    validations:
      required: true
