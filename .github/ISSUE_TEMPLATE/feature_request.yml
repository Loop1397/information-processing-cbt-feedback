name: 기능 제안
description: 학습 효율이나 편의성 향상을 위한 기능 제안
title: "[기능 제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        이 제보는 공개 이슈로 표시됩니다. 이름·이메일·계정 정보 등 민감한 개인정보가 업로드되지 않도록 주의해 주세요.
  - type: textarea
    id: need
    attributes:
      label: 개선점
      description: 현재 겪고있는 불편한 점이나 개선이 필요한 부분을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 위 개선점에 대한 의견이나 원하시는 방향이 있다면 자유롭게 작성해주세요.
    validations:
      required: false
