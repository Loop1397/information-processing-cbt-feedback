name: 기능 제안
description: 학습 경험을 개선할 아이디어를 제안해 주세요.
title: "[기능 제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        제안은 공개 이슈로 표시됩니다. 개인정보, 비밀 정보 또는 저작권이 있는 문제 전문을 포함하지 마세요.
  - type: textarea
    id: need
    attributes:
      label: 어떤 상황에서 필요한가요?
      description: 현재 겪는 불편이나 학습 목적을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 어떻게 동작하면 좋을지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
    validations:
      required: false
